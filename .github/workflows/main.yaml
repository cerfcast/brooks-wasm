on: [push, pull_request]

name: Continuous Integration

jobs:
  brooksui-tests:
    name: Build Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
      - run: cargo install wasm-pack
      - run: wasm-pack build
      - run: npm run build
        working-directory: brooksui
